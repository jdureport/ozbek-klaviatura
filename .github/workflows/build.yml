name: APK yiğiş

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK yiğiş
        run: gradle :app:assembleRelease --no-daemon -PversionCode=${{ github.run_number }}

      - name: Faylni nomlaş
        run: cp app/build/outputs/apk/release/app-release.apk ozbek-klaviatura.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ozbek-klaviatura
          path: ozbek-klaviatura.apk

      - name: Reliz çiqariş
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Özbek klaviatura 0.1.${{ github.run_number }}
          files: ozbek-klaviatura.apk
          make_latest: true
