plugins {
    id 'com.android.application'
}

def buildNumber = (project.findProperty('versionCode') ?: '1').toString().toInteger()

android {
    namespace = 'uz.yangialifbo.klaviatura'
    compileSdk = 36

    defaultConfig {
        applicationId = 'uz.volontyor.klaviatura'
        minSdk = 26
        targetSdk = 36
        versionCode = buildNumber
        versionName = "1.0.${buildNumber}"
    }

    signingConfigs {
        // Sinov APK'lari uçun umumiy kalit (repozitoriyda).
        shared {
            storeFile = file('../keystore/klaviatura.jks')
            storePassword = 'yangialifbo'
            keyAlias = 'klaviatura'
            keyPassword = 'yangialifbo'
        }
        // Google Play uçun yuklaş kaliti — faqat GitHub Secrets orqali beriladi.
        if (System.getenv('UPLOAD_KEYSTORE_FILE')) {
            upload {
                storeFile = file(System.getenv('UPLOAD_KEYSTORE_FILE'))
                storePassword = System.getenv('UPLOAD_KEYSTORE_PASSWORD')
                keyAlias = System.getenv('UPLOAD_KEY_ALIAS')
                keyPassword = System.getenv('UPLOAD_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            signingConfig = signingConfigs.shared
        }
        // Play uçun AAB: yuklaş kaliti bilan imzolanadi.
        play {
            initWith release
            signingConfig = System.getenv('UPLOAD_KEYSTORE_FILE') ? signingConfigs.upload : signingConfigs.shared
        }
        debug {
            signingConfig = signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}
